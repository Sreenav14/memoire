services:
  db:
    build:
      context: .
      dockerfile: docker/postgresql/Dockerfile
    container_name: memoire-db
    environment:
      POSTGRES_USER: memoire
      POSTGRES_PASSWORD: memoire
      POSTGRES_DB: memoire
    ports:
      - "5433:5432"
    volumes:
      - memoire_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoire -d memoire"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  memoire_db_data:
